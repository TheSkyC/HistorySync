version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      dev-tooling:
        patterns:
          - "pip-tools"
          - "pre-commit"
          - "pyinstaller"
          - "pytest"
          - "pytest-cov"
          - "ruff"
      docs:
        patterns:
          - "mkdocs"
          - "mkdocs-*"
          - "pymdown-extensions"
