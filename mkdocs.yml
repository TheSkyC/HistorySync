site_name: HistorySync Docs
site_url: https://theskyc.github.io/HistorySync/
site_description: HistorySync — Unified browser history management and cloud backup
site_author: TheSkyC
repo_url: https://github.com/TheSkyC/HistorySync
repo_name: TheSkyC/HistorySync
edit_uri: edit/main/docs/site/

docs_dir: docs/site
site_dir: site

theme:
  name: material
  language: en
  favicon: assets/favicon.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
    - toc.integrate

plugins:
  - search:
      separator: '[\s\-\.]+'
  - macros:
      on_error_fail: true
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          default: true
          name: English
          build: true
        - locale: zh
          name: 简体中文
          build: true
          nav_translations:
            Home: 首页
            User Guide: 用户指南
            Installation: 安装
            Quick Start: 快速上手
            CLI Reference: CLI 命令参考
            WebDAV Setup: WebDAV 配置
            Keyboard Shortcuts: 键盘快捷键
            FAQ: 常见问题
            Developer Guide: 开发者指南
            Architecture: 架构概览
            Contributing: 贡献指南
            Security: 安全架构
            Changelog: 更新日志
        - locale: zh-TW
          name: 繁體中文
          build: true
          nav_translations:
            Home: 首頁
            User Guide: 使用指南
            Installation: 安裝
            Quick Start: 快速上手
            CLI Reference: CLI 命令參考
            WebDAV Setup: WebDAV 設定
            Keyboard Shortcuts: 鍵盤快捷鍵
            FAQ: 常見問題
            Developer Guide: 開發者指南
            Architecture: 架構概覽
            Contributing: 貢獻指南
            Security: 安全架構
