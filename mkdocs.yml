            Installation: 설치
            Quick Start: 빠른 시작
            CLI Reference: CLI 참조
            WebDAV Setup: WebDAV 설정
            Keyboard Shortcuts: 키보드 단축키
            FAQ: 자주 묻는 질문
            Developer Guide: 개발자 가이드
            Architecture: 아키텍처
            Contributing: 기여
            Security: 보안
            Changelog: 변경 로그
        - locale: fr
          name: Français
