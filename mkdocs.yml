            Installation: インストール
            Quick Start: クイックスタート
            CLI Reference: CLIリファレンス
            WebDAV Setup: WebDAV設定
            Keyboard Shortcuts: キーボードショートカット
            FAQ: よくある質問
            Developer Guide: 開発者ガイド
            Architecture: アーキテクチャ
            Contributing: コントリビューション
            Security: セキュリティ
            Changelog: 更新履歴
        - locale: ko
